[project]
name = "cim-lab-6"
version = "0.1.0"
description = "Diffusion posterior sampling (DPS) for super-resolution and other inverse problems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepinv>=0.5,<0.6",
  "hydra-core>=1.3.2",
  "matplotlib>=3.9",
  "pillow>=10.4",
  "torch>=2.5",
  "torchmetrics>=1.4",
  "torchvision>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cim_lab_6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
